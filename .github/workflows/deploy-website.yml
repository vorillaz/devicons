name: Deploy Website

on:
  push:
    branches:
      - main
      - canary
    paths:
      - 'apps/website/**'
      - 'packages/agent/**'
      - 'packages/font/src/**'
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to deploy to
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_PROJECT_NAME: devicons-website

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Cloudflare Pages branch
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            env="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            env="production"
          else
            env="staging"
          fi

          if [ "$env" = "production" ]; then
            branch="main"
          else
            branch="canary"
          fi

          echo "environment=$env" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Deploying $env via Cloudflare branch $branch"

      - name: Restore Astro build cache
        uses: actions/cache@v4
        with:
          # Astro's cacheDir is set to './cache' in astro.config.mjs, which
          # resolves to apps/website/cache (optimized images, font assets).
          # .astro holds content collections, generated types, and the content
          # data store — all expensive to regenerate on a cold build.
          path: |
            apps/website/cache
            apps/website/.astro
            apps/website/.og-cache
          # Key is unique per commit so every run saves a fresh cache (the
          # .astro content store evolves with content edits). restore-keys
          # falls back to the most recent cache on this runner for a warm
          # start. GitHub evicts oldest caches automatically past 10 GB.
          key: astro-website-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            astro-website-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            astro-website-${{ runner.os }}-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core icon assets
        run: pnpm build:icons

      - name: Build website
        run: pnpm build:website
        env:
          NODE_ENV: production
          DEPLOY_ENV: ${{ steps.target.outputs.environment }}

      # Validate every /api/v1 file, discovery file, and agent docs page
      # against the shared schemas before anything is deployed.
      - name: Check agent surfaces
        run: pnpm -F @dev.icons/website check:api

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # Run wrangler from apps/website so it picks up both the static
          # output (dist/) and the Pages Functions (functions/og/icons/...)
          # that render OG images on demand at the edge.
          workingDirectory: apps/website
          # Wrangler is pre-installed via pnpm (see apps/website/package.json)
          # so the action skips its own npm-based install which otherwise
          # re-runs every package's postinstall script and breaks the build.
          packageManager: pnpm
          wranglerVersion: '4.83.0'
          command: pages deploy dist --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --branch=${{ steps.target.outputs.branch }}

      # Built after deploy so a CLI build problem can't block the website.
      - name: Build devicons CLI
        run: pnpm -F devicons build:lib

      # End-to-end check of the deployed API, search, MCP server, and CLI.
      - name: Smoke test agent surfaces
        run: pnpm -F @dev.icons/website smoke:agent "${{ steps.deploy.outputs.deployment-url }}"

      - name: Summary
        run: |
          {
            echo "### Cloudflare Pages deployment"
            echo ""
            echo "- Environment: \`${{ steps.target.outputs.environment }}\`"
            echo "- Branch: \`${{ steps.target.outputs.branch }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- URL: ${{ steps.deploy.outputs.deployment-url }}"
          } >> "$GITHUB_STEP_SUMMARY"
