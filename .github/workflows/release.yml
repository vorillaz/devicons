name: Release

on:
  push:
    branches: [main, canary]
    # Anything that can change a published package. Each release group only
    # counts commits inside its own paths (scripts/release-scopes.cjs), so a
    # run with nothing relevant is a cheap no-op.
    paths:
      - 'packages/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run mode (no publish, no tags)'
        type: boolean
        default: false
      republish_tag:
        description: >-
          Recovery: publish whatever is missing on npm for an existing tag
          (e.g. v1.3.0 or devicons-v2.2.0-canary.1). Leave empty for a normal release.
        type: string
        default: ''

permissions:
  contents: read

# Serialize release runs per-branch. If two PRs merge to main back-to-back,
# we queue rather than race — two parallel runs would both try to commit the
# release notes/version bump and one would fail with "local branch behind".
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release @dev.icons/* and devicons
    if: ${{ !inputs.republish_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write       # commit CHANGELOG, push tags, create releases
      issues: write         # semantic-release issue comments
      pull-requests: write  # semantic-release PR comments
      id-token: write       # npm Trusted Publisher (OIDC) + provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          # registry-url intentionally omitted. setup-node's generated
          # ~/.npmrc pins `_authToken=${NODE_AUTH_TOKEN}` and with no
          # NODE_AUTH_TOKEN that expands to an empty token, which npm
          # treats as explicit auth and short-circuits the Trusted
          # Publisher OIDC handshake — producing a 404 on publish.
      - name: Install npm for Trusted Publisher
        # OIDC publishing needs npm ≥ 11.5.1; Node 22 bundles 10.x. Installed
        # once here so the publish plugin can run all packages in parallel.
        run: |
          npm install -g 'npm@^11.5.1'
          echo "node $(node --version), npm $(npm --version)"
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || { echo "::error::OIDC token env missing — is id-token: write granted?"; exit 1; }
      - run: pnpm install --frozen-lockfile

      # One build feeds both release groups: build-all emits the sprite, font
      # assets, framework sources, the devicons font package and core's lib.
      - name: Build core + devicons font package
        run: pnpm -F @dev.icons/core build
      - name: Bundle react/vue/svelte
        run: pnpm --parallel -F @dev.icons/react -F @dev.icons/vue -F @dev.icons/svelte bundle
      - name: Check codepoints lock is committed
        # The font build pins codepoints for new glyphs. If that changed the
        # lock here, the release would ship glyph codepoints that aren't in git.
        run: |
          git diff --exit-code packages/font/codepoints.lock.json || {
            echo "::error file=packages/font/codepoints.lock.json::codepoints.lock.json is out of date — run 'pnpm build:font' and commit the lock."
            exit 1
          }
      - run: pnpm test

      - name: Release @dev.icons/{core,react,vue,svelte}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node scripts/release-group1.mjs
      - name: Release devicons
        # Runs after group1 in the same job, so it already sits on group1's
        # release commit — no race on pushing to main.
        # cwd = packages/font so semantic-release picks up its release.config.cjs.
        working-directory: packages/font
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then ARGS="--dry-run"; fi
          pnpm exec semantic-release $ARGS

  republish:
    name: Republish ${{ inputs.republish_tag }}
    if: ${{ inputs.republish_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write       # npm Trusted Publisher (OIDC) + provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ inputs.republish_tag }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install npm for Trusted Publisher
        run: |
          npm install -g 'npm@^11.5.1'
          echo "node $(node --version), npm $(npm --version)"
      - run: pnpm install --frozen-lockfile
      - name: Build core + devicons font package
        run: pnpm -F @dev.icons/core build
      - name: Bundle react/vue/svelte
        run: pnpm --parallel -F @dev.icons/react -F @dev.icons/vue -F @dev.icons/svelte bundle
      - name: Publish missing packages
        env:
          TAG: ${{ inputs.republish_tag }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node scripts/republish.mjs "$TAG"

  sync-canary:
    name: Sync main → canary
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only after a real release on main. Skip on canary pushes, dry-runs,
    # and any workflow_dispatch (manual runs are for testing).
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: canary
          persist-credentials: true
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Merge main into canary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main
          MAIN_SHA=$(git rev-parse origin/main)
          CANARY_SHA=$(git rev-parse HEAD)

          if [ "$MAIN_SHA" = "$CANARY_SHA" ]; then
            echo "canary is already at main ($MAIN_SHA) — nothing to sync."
            exit 0
          fi

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "canary already contains main — nothing to sync."
            exit 0
          fi

          if git merge --ff-only origin/main; then
            echo "Fast-forwarded canary to main."
            git push origin canary
            exit 0
          fi

          echo "Fast-forward not possible — creating a merge commit."
          if git merge origin/main --no-edit \
              -m "chore(sync): merge main into canary [skip ci]"; then
            git push origin canary
            echo "canary synced with main via merge commit."
            exit 0
          fi

          echo "Merge conflict — aborting and opening a sync PR for manual resolution."
          git merge --abort || true

          SYNC_BRANCH="chore/sync-main-into-canary-${GITHUB_RUN_ID}"
          git checkout -b "$SYNC_BRANCH" origin/canary
          if git merge origin/main --no-edit \
              -m "chore(sync): merge main into canary [skip ci]"; then
            git push origin "$SYNC_BRANCH"
          else
            git add -A
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "chore(sync): merge main into canary (CONFLICTS — resolve before merging) [skip ci]" || true
            git push origin "$SYNC_BRANCH"
          fi

          gh pr create \
            --base canary \
            --head "$SYNC_BRANCH" \
            --title "chore(sync): merge main into canary" \
            --body "Automated sync after main release failed to merge cleanly. Resolve conflicts and merge this PR to bring canary up to date with main." \
            --label sync || true

          echo "::error::main → canary merge had conflicts. Sync PR opened on branch $SYNC_BRANCH."
          exit 1
