name: Release PR

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Optional PR title override'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  open-release-pr:
    name: Open canary → main release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: canary
          persist-credentials: false

      - name: Verify canary is ahead of main
        id: diff
        run: |
          git fetch origin main canary
          AHEAD=$(git rev-list --count origin/main..origin/canary)
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          if [ "$AHEAD" = "0" ]; then
            echo "canary has no commits ahead of main — nothing to release." >&2
            exit 1
          fi
          echo "canary is $AHEAD commit(s) ahead of main."

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Compute next versions
        # Same commit scopes and preset as the Release workflow, so the title
        # matches what merging will actually publish.
        id: next
        run: node scripts/next-version.mjs origin/main origin/canary | tee -a "$GITHUB_OUTPUT"

      - name: Build PR body
        id: body
        env:
          GROUP1_NEXT: ${{ steps.next.outputs.group1 }}
          FONT_NEXT: ${{ steps.next.outputs.font }}
        run: |
          next() { if [ -n "$1" ]; then echo "**v$1**"; else echo 'no release'; fi; }
          {
            echo 'body<<EOF'
            echo "## Release PR"
            echo ''
            echo "Promoting **canary** to **main**."
            echo ''
            echo '| Packages | Next version |'
            echo '| --- | --- |'
            echo "| \`@dev.icons/{core,react,vue,svelte}\` | $(next "$GROUP1_NEXT") |"
            echo "| \`devicons\` (font) | $(next "$FONT_NEXT") |"
            echo ''
            echo "- Commits ahead of main: **${{ steps.diff.outputs.ahead }}**"
            echo "- Merging this PR triggers the [Release workflow](../actions/workflows/release.yml) to publish packages to npm."
            echo ''
            echo '### Changes'
            echo ''
            git log origin/main..origin/canary --pretty=format:'- %s (%h)' --no-merges
            echo ''
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create or update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_TITLE: ${{ github.event.inputs.title }}
          GROUP1_NEXT: ${{ steps.next.outputs.group1 }}
          FONT_NEXT: ${{ steps.next.outputs.font }}
          PR_BODY: ${{ steps.body.outputs.body }}
        run: |
          if [ -n "$CUSTOM_TITLE" ]; then
            TITLE="$CUSTOM_TITLE"
          elif [ -n "$GROUP1_NEXT" ] && [ -n "$FONT_NEXT" ]; then
            TITLE="chore(release): v${GROUP1_NEXT} + devicons v${FONT_NEXT}"
          elif [ -n "$GROUP1_NEXT" ]; then
            TITLE="chore(release): v${GROUP1_NEXT}"
          elif [ -n "$FONT_NEXT" ]; then
            TITLE="chore(release): devicons v${FONT_NEXT}"
          else
            TITLE="chore(release): promote canary to main"
          fi

          EXISTING=$(gh pr list --base main --head canary --state open --json number --jq '.[0].number' || true)

          if [ -n "$EXISTING" ]; then
            echo "Updating existing PR #$EXISTING"
            gh pr edit "$EXISTING" --title "$TITLE" --body "$PR_BODY"
            gh pr view "$EXISTING" --json url --jq '.url'
          else
            echo "Creating new PR"
            gh pr create \
              --base main \
              --head canary \
              --title "$TITLE" \
              --body "$PR_BODY" \
              --label release
          fi
